<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Ferro</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ferro.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post">
    <div class="brand">
      <img class="brand-mark" src="{{ url_for('static', filename='img/logo.svg') }}" alt="Ferro">
      <div class="brand-name" style="margin-top:12px">FERRO</div>
      <div class="brand-sub">Taller mecánico · Gestión</div>
    </div>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in mensajes %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="stack">
      <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
      <div><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" name="recordar" value="1"> Recordarme</label>
      <button class="btn btn-primary" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Ingresar</button>
    </div>
  </form>
</body>
</html>
