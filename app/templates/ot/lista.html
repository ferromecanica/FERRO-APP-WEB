{% extends "base.html" %}
{% block title %}Taller{% endblock %}
{% block content %}
<div class="page-head">
  <div><div class="eyebrow">Órdenes de trabajo</div><h1>Taller</h1></div>
  <div class="actions">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" name="q" value="{{ q }}" placeholder="Nº, patente, cliente o trabajo…"
             hx-get="{{ url_for('ot.lista') }}" hx-trigger="input changed delay:250ms, search" hx-include="[name=estado]"
             hx-target="#tabla-ot" hx-push-url="true">
      <input type="hidden" name="estado" value="{{ estado or '' }}"></div>
    <a class="btn btn-primary" href="{{ url_for('ot.form') }}"><i class="fa-solid fa-plus"></i> Nueva OT</a>
  </div>
</div>
<div class="filters" style="margin-bottom:14px">
  <a class="chip {{ 'active' if not estado }}" href="{{ url_for('ot.lista', q=q or None) }}">Todas</a>
  {% for e in estados %}<a class="chip {{ 'active' if e == estado }}" href="{{ url_for('ot.lista', estado=e, q=q or None) }}">{{ e }}</a>{% endfor %}
</div>
<div class="card" id="tabla-ot">{% include "ot/_tabla.html" %}</div>
{% endblock %}
