{% extends "base.html" %}
{% block title %}Stock{% endblock %}
{% block content %}
<div class="page-head">
  <div><div class="eyebrow">Gestión</div><h1>Stock</h1></div>
  <div class="actions"><a class="btn btn-primary" href="{{ url_for('stock.ficha') }}"><i class="fa-solid fa-plus"></i> Repuesto</a></div>
</div>
{% include "stock/_tabs.html" %}
<form class="barra-filtros" hx-get="{{ url_for('stock.lista') }}" hx-target="#tabla-stock" hx-push-url="true"
      hx-trigger="input changed delay:250ms from:input[name=q], change from:select, search">
  <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" name="q" value="{{ q }}" placeholder="Nombre, nº de parte, código, compatibilidad…" autocomplete="off"></div>
  <select name="categoria">
    <option value="">Todas las categorías</option>
    {% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if c.id == categoria_id }}>{{ c.nombre }}</option>{% endfor %}
  </select>
  <select name="filtro">
    <option value="">Todo el stock</option>
    <option value="con_stock" {{ 'selected' if filtro == 'con_stock' }}>Con stock</option>
    <option value="sin_stock" {{ 'selected' if filtro == 'sin_stock' }}>Sin stock</option>
    <option value="bajo" {{ 'selected' if filtro == 'bajo' }}>Para reponer (bajo mínimo)</option>
  </select>
</form>
<div class="card" id="tabla-stock">{% include "stock/_tabla.html" %}</div>
{% endblock %}
