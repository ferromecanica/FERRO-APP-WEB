{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div class="page-head">
  <div><div class="eyebrow">Taller</div><h1>Clientes</h1></div>
  <div class="actions">
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" name="q" value="{{ q }}" placeholder="Nombre, teléfono, patente, auto o nota…"
             hx-get="{{ url_for('clientes.lista') }}" hx-trigger="input changed delay:250ms, search"
             hx-target="#tabla-clientes" hx-push-url="true">
    </div>
    <a class="btn btn-primary" href="{{ url_for('clientes.form') }}"><i class="fa-solid fa-plus"></i> Cliente</a>
  </div>
</div>
<div class="card" id="tabla-clientes">{% include "clientes/_tabla.html" %}</div>
{% endblock %}
