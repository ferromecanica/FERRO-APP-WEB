{% extends "base.html" %}
{% block title %}Vehículos{% endblock %}
{% block content %}
<div class="page-head">
  <div><div class="eyebrow">Taller</div><h1>Vehículos</h1></div>
  <div class="actions">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" name="q" value="{{ q }}" placeholder="Patente, marca, modelo o dueño…"
             hx-get="{{ url_for('clientes.vehiculos') }}" hx-trigger="input changed delay:250ms, search"
             hx-target="#tabla-vehiculos" hx-push-url="true"></div>
    <a class="btn btn-primary" href="{{ url_for('clientes.vehiculo_form') }}"><i class="fa-solid fa-plus"></i> Vehículo</a>
  </div>
</div>
<div class="card" id="tabla-vehiculos">{% include "clientes/_tabla_vehiculos.html" %}</div>
{% endblock %}
